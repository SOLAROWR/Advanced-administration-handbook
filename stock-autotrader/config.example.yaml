# ============================================================
#  자동매매 설정 파일
#  이 파일을 복사해서 config.yaml 로 이름을 바꾼 뒤 수정하세요.
#  '#' 뒤의 글은 설명(주석)이라 프로그램이 읽지 않습니다.
# ============================================================

# paper = 모의투자(가상 돈), real = 실전투자(진짜 돈)
# 처음에는 반드시 paper 로 최소 2~4주 돌려보세요.
mode: paper

# true  = 주문을 실제로 보내지 않고 "이렇게 주문했을 것"이라고 기록만 함
# false = 실제로 주문을 보냄 (paper 모드면 모의투자 계좌로)
dry_run: true

# 자동매매할 종목 목록 (6자리 종목코드 + 이름)
# 여기에 없는 종목은 프로그램이 절대 건드리지 않습니다.
# (직접 사둔 주식은 안전하게 보호됩니다)
watchlist:
  - code: "005930"
    name: 삼성전자
  - code: "000660"
    name: SK하이닉스
  - code: "035420"
    name: NAVER
  - code: "005380"
    name: 현대차
  - code: "035720"
    name: 카카오

# ---------------- 매매 전략 ----------------
# 매수: 단기 이동평균선이 장기 이동평균선을 위로 뚫을 때(골든크로스)
#       + RSI가 너무 높지 않을 때(과열 아님) + 거래량이 평소보다 많을 때
# 매도: 단기 이동평균선이 장기 이동평균선을 아래로 뚫을 때(데드크로스)
strategy:
  short_ma: 5          # 단기 이동평균 (5일)
  long_ma: 20          # 장기 이동평균 (20일)
  rsi_period: 14       # RSI 계산 기간
  rsi_buy_max: 70      # RSI가 이 값 이상이면 과열로 보고 매수하지 않음
  volume_filter: true  # 거래량이 20일 평균보다 많을 때만 매수
  volume_ma: 20

# ---------------- 위험 관리 (가장 중요!) ----------------
risk:
  max_positions: 3        # 동시에 보유할 최대 종목 수
  position_pct: 30        # 한 종목에 넣을 최대 금액 = 총자산의 30%
  stop_loss_pct: -5.0     # 산 가격보다 5% 떨어지면 자동 손절
  take_profit_pct: 10.0   # 산 가격보다 10% 오르면 자동 익절
  max_buys_per_day: 2     # 하루 최대 신규 매수 횟수
  max_order_amount: 1000000  # 한 번 주문 최대 금액(원). 실수 방지용 상한선

# ---------------- 실행 시간 ----------------
schedule:
  signal_time: "15:15"      # 매일 이 시각에 매수/매도 신호를 계산 (장마감 15:30 전)
  check_interval_min: 5     # 장중 몇 분마다 손절/익절을 확인할지

# ---------------- 비용 (백테스트 계산용) ----------------
costs:
  fee_pct: 0.015   # 증권사 수수료 (매수·매도 각각, %)
  tax_pct: 0.20    # 증권거래세 (매도 시, %) — 매년 바뀔 수 있으니 확인하세요

# ---------------- 휴장일 ----------------
# 주말은 자동으로 쉽니다. 공휴일·임시휴장일은 여기에 적어주세요.
# 매년 한국거래소(KRX) 휴장일 공지를 확인해서 업데이트하세요.
holidays:
  - "2026-10-05"   # 개천절 대체공휴일
  - "2026-10-09"   # 한글날
  - "2026-12-25"   # 성탄절
  - "2026-12-31"   # 연말 휴장
